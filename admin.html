<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Editor</title><link rel="stylesheet" href="css/style.css"></head><body><header><b>ADMIN EDITOR</b><small> No database</small></header><main><section class="page active"><div class="notice">Edit predictions here, then download <b>predictions.js</b> and replace the existing file on your website. There is no online database.</div><div class="form"><input id="date" type="date"><input id="sport" placeholder="Sport"><input id="match" placeholder="Team A vs Team B"><input id="prediction" placeholder="Prediction"><input id="odds" placeholder="Odds (optional)"><button id="add">Add Prediction</button></div><div id="list"></div><button id="download" class="primary">Download predictions.js</button></section></main><script src="js/predictions.js"></script><script>let a=JSON.parse(JSON.stringify(window.PREDICTIONS||[]));const $=x=>document.getElementById(x);$("date").value=new Date().toISOString().slice(0,10);function render(){ $("list").innerHTML=a.map((p,i)=>`<article class="card"><b>${p.match}</b><br><small>${p.date} • ${p.sport} • ${p.prediction}</small><p>Status: <span class="badge ${p.result}">${p.result}</span></p><button onclick="a[${i}].result='WIN';render()">WIN</button> <button onclick="a[${i}].result='LOSS';render()">LOSS</button> <button onclick="a[${i}].result='NOT RESULTED';render()">PENDING</button> <button onclick="a.splice(${i},1);render()">DELETE</button></article>`).join("")||'<div class="empty">No predictions.</div>'}$("add").onclick=()=>{if(!$("match").value||!$("prediction").value)return alert("Enter match and prediction.");a.unshift({id:String(Date.now()),date:$("date").value,sport:$("sport").value||"Other",match:$("match").value,prediction:$("prediction").value,odds:$("odds").value,result:"NOT RESULTED"});render()};$("download").onclick=()=>{let b=new Blob(["window.PREDICTIONS="+JSON.stringify(a,null,2)+";"],{type:"application/javascript"}),x=document.createElement("a");x.href=URL.createObjectURL(b);x.download="predictions.js";x.click()};render();</script></body></html>
